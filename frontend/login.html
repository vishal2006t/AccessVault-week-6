<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | DG Interns Hub - Week 6 Auth</title>
  <meta name="description" content="Secure login page with JWT authentication and bcrypt password verification.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 18c-3.75-1-6.5-4.88-6.9-9h13.8c-.4 4.12-3.15 8-6.9 9z'/></svg>">
</head>
<body>
  <div class="ambient-glow"></div>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="nav-brand" id="nav-brand-link">
      <div class="brand-icon">W6</div>
      <div>
        <div class="brand-title">DG Interns Hub</div>
      </div>
      <span class="brand-badge">Week 6 Auth</span>
    </a>
    <nav class="nav-links">
      <a href="login.html" class="nav-link active" id="nav-login-link">Log In</a>
      <a href="signup.html" class="nav-link" id="nav-signup-link">Sign Up</a>
    </nav>
  </header>

  <!-- Main Login Container -->
  <main class="main-wrapper">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Secure Authentication</span>
          </div>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Enter your credentials to access the Dashboard</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="alert-box" role="alert">
          <div class="alert-icon" id="alertIcon"></div>
          <div class="alert-content" id="alertMessage"></div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
          <!-- Email Field -->
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </span>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input" 
                placeholder="alex@example.com" 
                autocomplete="email" 
                required 
              />
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="Enter your password (e.g. Vishal@123)" 
                autocomplete="current-password" 
                required 
              />
              <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" id="loginSubmitBtn">
            <span id="btnText">Sign In</span>
            <span id="btnSpinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <!-- Footer Link -->
        <div class="auth-footer">
          Don't have an account? <a href="signup.html" class="auth-link" id="linkToSignup">Create one here</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>DG Interns Hub &bull; <span>Week 6: Backend Integration &amp; Authentication</span></p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
